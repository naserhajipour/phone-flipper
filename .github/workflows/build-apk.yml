name: Build APK

# Builds a signed, zipaligned release APK on every push, keeps it as a build
# artifact and refreshes the rolling `apk-latest` release so the download link
# is always stable.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # All actions below are pinned to full commit SHAs (repository policy).
  JAVA_VERSION: '17'
  ANDROID_PLATFORM: 'android-35'
  BUILD_TOOLS: '35.0.0'

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.BUILD_TOOLS }}" > /dev/null
          echo "Platform: $ANDROID_HOME/platforms/${{ env.ANDROID_PLATFORM }}"
          echo "Build tools: $ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS }}"

      - name: Build signed release APK
        run: |
          chmod +x gradlew scripts/*.sh scripts/*.py
          ./scripts/build_apk.sh release
          ls -lh build/outputs/

      - name: Verify signature and manifest
        run: |
          APK=$(ls build/outputs/*.apk | head -1)
          APKSIGNER="$ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS }}/lib/apksigner.jar"
          java -jar "$APKSIGNER" verify --print-certs "$APK" | head -5
          AAPT2="$ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS }}/aapt2"
          "$AAPT2" dump badging "$APK" | head -6
          # Hard failure if the app ever gains network access.
          if "$AAPT2" dump badging "$APK" | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission leaked into the offline build"; exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FlipperOne-apk
          path: build/outputs/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish rolling release
        # Manual runs, tags and the default branch keep `apk-latest` current.
        if: >-
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v') ||
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls build/outputs/*.apk | head -1)
          cp "$APK" FlipperOne.apk
          if gh release view apk-latest > /dev/null 2>&1; then
            gh release upload apk-latest FlipperOne.apk --clobber
          else
            gh release create apk-latest FlipperOne.apk \
              --title "Flipper One — latest APK" \
              --notes "Signed, offline release build. minSdk 24, targetSdk 35. No INTERNET permission."
          fi
